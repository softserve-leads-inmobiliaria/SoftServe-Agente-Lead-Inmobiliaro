# Migraciones de esquema (C-3). Se corren con:  alembic upgrade head
# La URL de la base sale de db/settings.py (DATABASE_URL o POSTGRES_*), no de este archivo.
[alembic]
script_location = db/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
