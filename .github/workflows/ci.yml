name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      # Contract tests: no necesitan ningún servicio levantado.
      - name: Contract tests
        run: python -m pytest tests/contracts -q

      # Cada suite corre por separado (los servicios comparten el nombre de paquete `app`).
      # Una carpeta sin ningún test_*.py todavía se omite, para no fallar por "0 tests".
      - name: Tests por servicio y paquete
        run: |
          status=0
          for dir in db/tests services/core/tests services/catalog/tests services/panel/tests tests/harness; do
            if find "$dir" -name 'test_*.py' 2>/dev/null | grep -q .; then
              echo "::group::$dir"
              python -m pytest "$dir" -q || status=1
              echo "::endgroup::"
            else
              echo "Sin tests todavía en $dir — se omite"
            fi
          done
          exit $status
