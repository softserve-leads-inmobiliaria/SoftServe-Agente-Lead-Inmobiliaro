# Stack base local (CT-6): Postgres+pgvector, observabilidad (Phoenix) y un panel vacío.
# Sin nube y sin Redis (DT-3, DT-4). Todos los valores tienen un default de desarrollo, así que
# `docker compose up` funciona sin crear un .env; copiá .env.example a .env solo para cambiarlos.
#
# Esqueleto end-to-end (CT-4): `harness` -> `core` -> `catalog` (MCP en /mcp, sobre Postgres desde C-1). Al hacer
# `docker compose up --build` el arnés reproduce todos los guiones de harness/fixtures contra el core
# y termina. Para que el comando devuelva el resultado del arnés (0 = todo en verde):
#   docker compose run --rm --build harness
# (no usar `up --exit-code-from`: `migrate` también termina y apagaría todo antes de tiempo).
# Los healthchecks de core, catalog y panel viven en su Dockerfile (#65): el compose no los repite.

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leads}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leads_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-leads}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leads} -d ${POSTGRES_DB:-leads}"]
      interval: 5s
      timeout: 5s
      retries: 10

  phoenix:
    image: arizephoenix/phoenix:version-20.14.0
    ports:
      # UI y receptor OTLP/HTTP (/v1/traces) en 6006; OTLP/gRPC en 4317.
      - "${PHOENIX_UI_PORT:-6006}:6006"
      - "${PHOENIX_OTLP_GRPC_PORT:-4317}:4317"
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenixdata:/mnt/data

  panel:
    build:
      # Contexto en la raíz del repo para poder copiar db/ y contracts/ (patrón de todos los servicios).
      context: .
      dockerfile: services/panel/Dockerfile
    environment:
      # El panel lee leads, scores, visitas y la transcripción directo de Postgres (B-5).
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-leads}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leads_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-leads}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${PANEL_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Aplica las migraciones de Alembic (db/migrations) y termina. Los servicios que usen la base
  # (core, panel) dependen de que este paso termine bien.
  migrate:
    build:
      context: .
      dockerfile: db/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-leads}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leads_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-leads}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Siembra los asesores de demo y termina (B-5): sin ellos el panel no se puede abrir. Idempotente,
  # así que corre en cada `up` sin duplicar. El inventario de propiedades es de C-9, no de acá.
  seed:
    build:
      context: .
      dockerfile: db/Dockerfile
    command: ["python", "scripts/seed_advisors.py"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-leads}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leads_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-leads}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  catalog:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-leads}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leads_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-leads}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  core:
    build:
      context: .
      dockerfile: services/core/Dockerfile
    environment:
      CATALOG_SERVICE_URL: http://catalog:8000
      # El estado de las conversaciones vive en Postgres (DT-1): sin base no hay core.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-leads}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leads_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-leads}
      # Sin token, el core levanta igual y solo atiende /events (B-1, DT-4).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Trazas por turno hacia Phoenix (OBS-1, DT-9). Sin `depends_on` a propósito: si Phoenix está
      # caído las trazas se pierden, pero el bot sigue respondiendo.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://phoenix:6006
      # Vacío = las trazas no llevan el texto de los mensajes. `1` solo para depurar en local.
      TRACE_CONTENT: ${TRACE_CONTENT:-}
      # LLM (A-2, DT-6): `fake` no necesita credenciales; `bedrock` usa el LLM real.
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      BEDROCK_REGION: ${BEDROCK_REGION:-us-east-1}
      BEDROCK_MODEL_ID_CHAT: ${BEDROCK_MODEL_ID_CHAT:-}
      BEDROCK_MODEL_ID_CLASSIFIER: ${BEDROCK_MODEL_ID_CLASSIFIER:-}
      LLM_RATE_LIMIT_PER_MINUTE: ${LLM_RATE_LIMIT_PER_MINUTE:-10}
      LLM_MAX_QUEUE_WAIT_SECONDS: ${LLM_MAX_QUEUE_WAIT_SECONDS:-15}
      # Reintentos ante errores transitorios de Bedrock (A-14).
      LLM_RETRY_MAX_ATTEMPTS: ${LLM_RETRY_MAX_ATTEMPTS:-4}
      LLM_RETRY_BASE_DELAY_SECONDS: ${LLM_RETRY_BASE_DELAY_SECONDS:-0.5}
      LLM_RETRY_MAX_DELAY_SECONDS: ${LLM_RETRY_MAX_DELAY_SECONDS:-8}
      LLM_RETRY_MAX_TOTAL_SECONDS: ${LLM_RETRY_MAX_TOTAL_SECONDS:-20}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${CORE_PORT:-8000}:8000"
    depends_on:
      catalog:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  harness:
    build:
      context: .
      dockerfile: harness/Dockerfile
    environment:
      CORE_URL: http://core:8000
    depends_on:
      core:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  phoenixdata:
